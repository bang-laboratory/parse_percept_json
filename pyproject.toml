[project]
name = "parse_percept_json"
version = "0.1.3"
description = "Read DBS sensing data files from Medtronic Percept implant"
readme = "README.md"
authors = [
    { name = "Malte Lau Petersen", email = "maltelau@mlpetersen.dk" }
]
requires-python = ">=3.8"
dependencies = [
    "mne>=1.3.1",
    "numpy>=1.24.4",
    "polars>=0.18.4",
    "pytest>=8.3.5",
    "pytest-xdist>=3.6.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest]
minversion = "9.0"
addopts = ["-n", "4"]
testpaths = [
    "tests",
]
pythonpath = [
  "."
]
